name: Angular CI/CD

# Cuándo se ejecuta: en cada pull request dirigida a main
on:
  pull_request:
    branches: [main]

jobs:
  # Job de CI: compila el proyecto
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npx ng build --base-href /cicd-angular/
